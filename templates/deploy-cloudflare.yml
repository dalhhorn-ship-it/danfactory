# Route B (see .claude/skills/ship/SKILL.md): GitHub Actions → Cloudflare, tuned for short waits.
#  - test once: tests + preview run in parallel on the PR; merging to main only builds and deploys
#  - docs-only PRs skip the work but still report a green "test" check, so a required check
#    never blocks the merge (paths-ignore on pull_request would leave it "Expected" forever)
#  - superseded runs are cancelled; npm cache on
# Copy to .github/workflows/deploy-cloudflare.yml. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Branch protection on main: require the "test" check.
name: deploy-cloudflare
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "metrics/**", ".claude/**"]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: 22
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
             | grep -qvE '^(docs/|metrics/|\.claude/)|\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"
          else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  test:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.code != 'true'
        run: echo "docs-only change; tests skipped"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - if: needs.changes.outputs.code == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - if: needs.changes.outputs.code == 'true'
        run: npm test --if-present

  preview:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, deployments: write }
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - if: needs.changes.outputs.code == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      # Stable preview URL: https://pr-<number>-<worker>.<subdomain>.workers.dev (needs wrangler with --preview-alias)
      - if: needs.changes.outputs.code == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }} --var GIT_SHA:${{ github.event.pull_request.head.sha }}

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, deployments: write }
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var GIT_SHA:${{ github.sha }}
      - name: Record duration
        if: always()
        run: echo "deploy ${{ job.status }} in $(( $(date +%s) - T0 ))s (push-to-live is recorded by deploy-watcher)" >> "$GITHUB_STEP_SUMMARY"
