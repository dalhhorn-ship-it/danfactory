name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:  # job level: top level stays contents: read
      contents: read
      actions: read  # read-only run history for the dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }  # tags + history for the dashboard
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Merge gate (structure, build, lint, tests, acceptance, protected paths, review, security)
        env:
          # PRs: the base branch tip; pushes: the previous tip (all zeros on a first push: the gate falls back)
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/gate.py --base "$BASE" --summary "$GITHUB_STEP_SUMMARY"
      - name: Refresh CI history (best effort, read-only GitHub API call)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_runs.py
      - name: Build dashboard
        if: always()
        run: |
          python3 scripts/dashboard.py
          cat dashboard/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard
          path: dashboard/
          retention-days: 30
